version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "deps"
    # cactus-needle pins an exact version because the .cact weight format and
    # the native engine are version-locked; bump it deliberately, not on a bot's
    # schedule.
    ignore:
      - dependency-name: cactus-needle

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "docker"
